    <article class="card product-card h-100">
      <img class="card-img-top product-image" [src]="product.image" [alt]="product.title" />
      <div class="card-body d-flex flex-column">
        <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
          <span class="product-category">{{ product.category }}</span>
          <span class="small" [class.text-danger]="product.stock === 0" [class.text-success]="product.stock > 0">
            {{ product.stock > 0 ? product.stock + ' in stock' : 'Out of stock' }}
          </span>
        </div>
        <h2 class="h5 card-title mb-2">{{ product.title }}</h2>
        <p class="card-text text-secondary product-description mb-3">{{ product.description }}</p>
        <div class="mt-auto d-flex align-items-center justify-content-between gap-2">
          <strong class="price">{{ product.price | currency:'USD' }}</strong>
          <a class="btn btn-primary btn-sm" [routerLink]="['/products', product._id]">View Details</a>
        </div>
      </div>
    </article>
