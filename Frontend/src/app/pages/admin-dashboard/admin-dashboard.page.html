<section class="container py-5">
  <div class="page-heading">
    <p class="eyebrow">Store management</p>
    <h1>Admin dashboard</h1>
    <p class="text-secondary">A quick view of the information provided by the existing APIs.</p>
  </div>
  @if (error) {
    <div class="alert alert-danger">{{ error }}</div>
  }
  @if (loading) {
    <div class="py-5 text-center">
      <div class="spinner-border text-primary"></div>
      <p class="mt-2 text-secondary">Loading...</p>
    </div>
  } @else {
    <div class="row g-4">
      <div class="col-md-4">
        <div class="stat-card">
          <span>Total products</span><strong>{{ products.length }}</strong>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card">
          <span>Total orders</span><strong>{{ orders.length }}</strong>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card">
          <span>Pending orders</span><strong>{{ pendingOrders }}</strong>
        </div>
      </div>
    </div>
    <div class="admin-actions mt-5">
      <a routerLink="/admin/products" class="btn btn-primary">Manage Products</a
      ><a routerLink="/admin/orders" class="btn btn-outline-primary">Manage Orders</a>
    </div>
  }
</section>
