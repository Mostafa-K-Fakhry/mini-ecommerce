    <section class="auth-page container py-5"><div class="row justify-content-center"><div class="col-md-8 col-lg-5">
      <div class="auth-card">
        <p class="eyebrow">Welcome back</p><h1 class="h2 mb-4">Log in to your account</h1>
        @if (error) { <div class="alert alert-danger">{{ error }}</div> }
        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <div class="mb-3"><label class="form-label" for="email">Email</label><input id="email" type="email" class="form-control" formControlName="email" autocomplete="email"><div class="invalid-feedback d-block" *ngIf="submitted && form.controls.email.invalid">Enter a valid email address.</div></div>
          <div class="mb-4"><label class="form-label" for="password">Password</label><input id="password" type="password" class="form-control" formControlName="password" autocomplete="current-password"><div class="invalid-feedback d-block" *ngIf="submitted && form.controls.password.invalid">Password is required.</div></div>
          <button class="btn btn-primary w-100" [disabled]="loading">{{ loading ? 'Logging in...' : 'Login' }}</button>
        </form>
        <p class="text-secondary text-center mt-4 mb-0">New here? <a routerLink="/register">Create an account</a></p>
      </div>
    </div></div></section>
